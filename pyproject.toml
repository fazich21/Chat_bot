# Settings for deploying on Vercel (ignored when you run the app on your own computer).
[project]
name = "ask-faizan"
version = "1.0.0"
requires-python = ">=3.11"

[tool.vercel]
entrypoint = "api:app"            # the FastAPI app in api.py

[tool.vercel.scripts]
build = "python scripts/build_index.py"   # downloads the search models and builds the index
