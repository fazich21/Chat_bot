# Project settings. Vercel installs the dependencies listed here (it ignores requirements.txt
# when this file exists). The PDF/Word readers are left out on purpose: the index is built on
# your computer (python scripts/build_index.py) and committed, which keeps Vercel under 500 MB.
[project]
name = "ask-faizan"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "groq>=1.0",
    "fastembed>=0.7",
    "rank-bm25>=0.2.2",
    "numpy",
    "python-dotenv",
]

[tool.vercel]
entrypoint = "api:app"            # the FastAPI app in api.py

[tool.vercel.scripts]
build = "python scripts/build_index.py"   # downloads the search models and builds the index
